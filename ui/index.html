<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steezy Studio</title>
<!--
  Steezy Studio's face. Talks to gui.py's Api through pywebview.api. Styled to
  sit with the other tools: dark panel, violet accent, silkscreen labels, a
  state LED per tool. Tool names and messages are set with textContent only.
-->
<style>
  :root { --panel:#16171b; --raised:#1e2026; --edge:#2c2f37; --ink:#e9e7e2; --dim:#8b8d95;
          --amber:#a78bfa; --good:#5fd39a; --bad:#ff6b5e; --radius:8px;
          --ui:"Avenir Next","Avenir",-apple-system,BlinkMacSystemFont,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--panel); color:var(--ink); font:14px/1.45 var(--ui); -webkit-font-smoothing:antialiased;
         user-select:none; cursor:default; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:14px; padding:18px 24px 16px; border-bottom:1px solid var(--edge); }
  header img { width:38px; height:38px; }
  h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:.02em; }
  .label { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
  main { padding:22px 24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .tile { background:var(--raised); border:1px solid var(--edge); border-radius:var(--radius); padding:16px 18px;
          display:flex; flex-direction:column; gap:10px; }
  .tile.off { opacity:.5; }
  .top { display:flex; align-items:center; gap:10px; }
  .led { width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none; }
  .ready .led { background:var(--good); box-shadow:0 0 6px var(--good); }
  .name { font-size:16px; font-weight:600; flex:1; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--amber); }
  .meta { font-size:12px; color:var(--dim); min-height:18px; }
  .msg { font-size:13px; color:var(--ink); min-height:36px; }
  button { font:inherit; font-size:13px; color:var(--panel); background:var(--amber); border:0; border-radius:6px;
           padding:7px 16px; cursor:pointer; align-self:flex-start; font-weight:600; }
  button:disabled { background:var(--edge); color:var(--dim); cursor:default; }
  button.ghost { background:transparent; color:var(--amber); border:1px solid var(--amber); margin-right:8px; }
  #share { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; }
  #share.open { display:flex; }
  #sharebox { background:var(--raised); border:1px solid var(--edge); border-radius:var(--radius); padding:20px 22px;
              width:min(620px,92vw); max-height:86vh; overflow:auto; display:flex; flex-direction:column; gap:12px; user-select:text; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--edge); }
  .row .name { font-size:14px; flex:1; }
  .badge { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); border:1px solid var(--edge); border-radius:4px; padding:1px 6px; }
  .seg { display:flex; gap:6px; }
  .seg button { align-self:center; padding:5px 12px; }
  code { display:block; background:var(--panel); border:1px solid var(--edge); border-radius:6px; padding:8px 10px;
         font:11px/1.4 ui-monospace,Menlo,monospace; color:var(--dim); word-break:break-all; }
  #inviteRow { display:flex; gap:8px; align-items:center; }
  #inviteRow input { flex:1; background:var(--panel); color:var(--ink); border:1px solid var(--edge); border-radius:6px; padding:6px 9px; font:inherit; }
  #toast { color:var(--good); font-size:12px; min-height:16px; }
  #note { padding:0 24px 18px; color:var(--bad); font-size:13px; min-height:20px; }
</style>
<header><img src="logo.svg" alt=""><div style="flex:1"><h1>Steezy Studio</h1><div class="label">Your tools, in one place</div></div><button id="shareBtn" class="ghost">Share with friends</button><button id="updateAll">Update all</button></header>
<main id="tiles"></main>
<div id="note"></div>
<div id="share"><div id="sharebox">
  <div style="display:flex;align-items:center"><div style="flex:1"><h1>Share with friends</h1>
    <div class="label">Paste into Terminal (Mac) or PowerShell (Windows)</div></div><button id="shareClose" class="ghost" style="margin:0">Close</button></div>
  <div id="shareRows"></div>
  <div class="label">Invite to the private tools</div>
  <div id="inviteRow"><input id="inviteUser" placeholder="friend's GitHub username" autocomplete="off"><button id="inviteBtn">Invite</button></div>
  <div id="toast"></div>
</div></div>
<script>
  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function tile(t) {
    const box = el("div", "tile " + (t.usable ? "ready" : "off"));
    const top = el("div", "top");
    top.append(el("span", "led"), el("span", "name", t.name));
    if (t.usable && t.behind > 0) { const d = el("span", "dot"); d.title = t.behind + " update(s) waiting"; top.append(d); }
    box.append(top);
    if (notes[t.id]) box.append(el("div", "meta", notes[t.id]));
    if (t.usable) {
      let meta = (t.version || "?") + (t.dirty ? " · has local changes" : "");
      if (t.behind > 0) meta += " · " + t.behind + " newer";
      box.append(el("div", "meta", meta));
      const b = el("button", null, "Open");
      b.disabled = !t.app;
      if (!t.app) box.append(el("div", "msg", "Not built yet."));
      b.onclick = async () => { const r = await pywebview.api.open_tool(t.id); $("note").textContent = r.ok ? "" : r.message; };
      box.append(b);
    } else if (t.installable) {
      box.append(el("div", "msg", t.installing ? installingNote(t) : t.message));
      const b = el("button", null, t.installing ? "Installing…" : "Install");
      b.disabled = busy;
      b.onclick = () => install(t);
      box.append(b);
    } else {
      box.append(el("div", "msg", t.message));
      const b = el("button", null, t.state === "unsupported" ? "Not on this computer" : "Open");
      b.disabled = true; box.append(b);
    }
    return box;
  }

  // Beat Thief brings its instrument splitter (torch): most of a 2GB download.
  function installingNote(t) {
    return t.id === "beat_thief" ? "Downloading… this one is big (about 2GB), give it 10-20 minutes."
                                 : "Downloading and setting up…";
  }

  let busy = false;
  async function install(t) {
    const r = await pywebview.api.install_tool(t.id);
    if (!r.started) { $("note").textContent = r.message; return; }
    busy = true; $("updateAll").disabled = true; notes[t.id] = "";
    for (;;) {
      const s = await pywebview.api.update_status();
      s.results.forEach((x) => { notes[x.id] = x.message; });
      await init();
      if (!s.running) break;
      await new Promise((res) => setTimeout(res, 1000));
    }
    busy = false; $("updateAll").disabled = false;
    await init();
  }

  const notes = {};
  async function updateAll() {
    const b = $("updateAll"); b.disabled = true; b.textContent = "Updating…"; busy = true;
    await pywebview.api.update_all();
    for (;;) {
      const s = await pywebview.api.update_status();
      s.results.forEach((r) => { notes[r.id] = r.message; });
      await init();
      if (!s.running) break;
      await new Promise((r) => setTimeout(r, 700));
    }
    b.disabled = false; b.textContent = "Update all"; busy = false; await init();
  }
  $("updateAll").onclick = updateAll;

  // ---- Share with friends
  let shareData = null;
  async function copy(text) {
    let ok = false;
    try { ok = (await pywebview.api.copy_text(text)).ok; } catch (e) {}
    if (!ok) { try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {} }
    $("toast").textContent = ok ? "Copied. Paste it into Terminal." : "Couldn't copy - select the text below and copy it.";
  }
  function shareRow(name, cmds, badge, winReady) {
    const r = el("div", "row");
    r.append(el("span", "name", name));
    if (badge) r.append(el("span", "badge", badge));
    const seg = el("span", "seg");
    const mac = el("button", null, "Copy for Mac"); mac.disabled = !cmds.mac; mac.onclick = () => copy(cmds.mac);
    const win = el("button", null, winReady && cmds.windows ? "Windows (beta)" : "Windows: soon");
    win.disabled = !(winReady && cmds.windows); if (!win.disabled) win.onclick = () => copy(cmds.windows);
    seg.append(mac, win); r.append(seg);
    return r;
  }
  async function openShare() {
    shareData = await pywebview.api.share_options();
    const rows = [shareRow("Whole Steezy Studio", shareData.studio, null, shareData.windows_ready)];
    shareData.tools.forEach((t) => rows.push(shareRow(t.name, t.commands, t.private ? "needs invite" : null, shareData.windows_ready)));
    $("shareRows").replaceChildren(...rows);
    $("toast").textContent = ""; $("share").classList.add("open");
  }
  $("shareBtn").onclick = openShare;
  $("shareClose").onclick = () => $("share").classList.remove("open");
  $("inviteBtn").onclick = async () => {
    const u = $("inviteUser").value.trim();
    if (!u) return;
    if (!confirm("Send GitHub invites for the private tools to '" + u + "'?")) return;
    const res = await pywebview.api.invite_friend(u);
    $("toast").textContent = res.length ? res.map((r) => r.message).join(" ") : "No private tools to invite to.";
  };

  async function init() {
    const tiles = await pywebview.api.list_tools();
    $("tiles").replaceChildren(...tiles.map(tile));
  }
  // Draw first, then look for news from GitHub in the background.
  async function start() {
    await init();
    try {
      const s = await pywebview.api.check_updates();
      await init();
      if (s.known && s.behind > 0) $("note").textContent = "A newer Steezy Studio is available. Press Update all.";
    } catch (e) {}
  }
  if (window.pywebview && window.pywebview.api) start(); else window.addEventListener("pywebviewready", start);
</script>
