<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!--
  Movie Maker's mark, a sibling of the Ableton Loader's: the same near-black
  plate with a white rim, fine grooves and a violet label - but the plate is an
  old movie camera's body, with two film reels sitting on top (the right one a
  little smaller), and the label carries a strip of film.

  Everything is plain vector, so it scales from the 1024px app icon down to the
  small mark in each window's header.
-->
<defs>
<linearGradient id="sheen" x1="0.1" y1="0" x2="0.9" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
<stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.03"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
</defs>
