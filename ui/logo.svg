<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Steezy Studio's mark, in the same family as Beat Thief, the Ableton Loader
    and Movie Maker: a near-black rounded plate with a white rim and fine
    grooves. The label is a violet amp stack: a head on a cabinet with a glowing
    speaker cone.
  -->
  <defs>
    <linearGradient id="sheen" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cone" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F3EAFF"/>
      <stop offset="0.25" stop-color="#C9A8FF"/>
      <stop offset="0.65" stop-color="#8C5CFF"/>
      <stop offset="1" stop-color="#2A1B52"/>
    </radialGradient>
  </defs>
  <rect x="53" y="53" width="918" height="918" rx="200" fill="#0C0D10"/>
  <rect x="53" y="53" width="918" height="918" rx="200" fill="none" stroke="#FFFFFF" stroke-width="26"/>
  <g fill="none" stroke="#22232A">
    <rect x="119" y="119" width="786" height="786" rx="134" stroke-width="9"/>
    <rect x="171" y="171" width="682" height="682" rx="82" stroke-width="5" opacity="0.9"/>
    <rect x="223" y="223" width="578" height="578" rx="30" stroke-width="9"/>
    <rect x="275" y="275" width="474" height="474" rx="30" stroke-width="5" opacity="0.9"/>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="187" fill="url(#sheen)"/>
  <g>
    <!-- head -->
    <rect x="190" y="215" width="644" height="215" rx="28" fill="#0C0D10" stroke="#C9A8FF" stroke-width="14"/>
    <circle cx="285" cy="322" r="30" fill="#0C0D10" stroke="#C9A8FF" stroke-width="9"/>
    <path d="M285 322 L271 305" stroke="#F3EAFF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="375" cy="322" r="30" fill="#0C0D10" stroke="#C9A8FF" stroke-width="9"/>
    <path d="M375 322 L379 300" stroke="#F3EAFF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="465" cy="322" r="30" fill="#0C0D10" stroke="#C9A8FF" stroke-width="9"/>
    <path d="M465 322 L459 301" stroke="#F3EAFF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="555" cy="322" r="30" fill="#0C0D10" stroke="#C9A8FF" stroke-width="9"/>
    <path d="M555 322 L568 304" stroke="#F3EAFF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="645" cy="322" r="30" fill="#0C0D10" stroke="#C9A8FF" stroke-width="9"/>
    <path d="M645 322 L643 300" stroke="#F3EAFF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="760" cy="322" r="22" fill="#18E0FF"/>
    <circle cx="760" cy="322" r="38" fill="#18E0FF" fill-opacity="0.25"/>
    <!-- cabinet -->
    <rect x="190" y="450" width="644" height="400" rx="28" fill="#171226" stroke="#8C5CFF" stroke-width="14"/>
    <circle cx="512" cy="650" r="150" fill="#0C0D10" stroke="#C9A8FF" stroke-width="10"/>
    <circle cx="512" cy="650" r="126" fill="url(#cone)"/>
    <circle cx="512" cy="650" r="44" fill="#F3EAFF"/>
  </g>
</svg>
